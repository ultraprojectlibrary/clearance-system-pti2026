<!DOCTYPE html>
<html lang="en">

{% load static %}

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PTI Clearance System</title>
    <!-- Favicon -->
    <link rel="icon" href="{% static 'assets/images/favicon.png' %}" type="image/x-icon"/>
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.png' %}" type="image/x-icon"/>
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com/"/>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <!-- App design system -->
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}?v=3"/>
</head>

<body>

  <!-- Minimal auth top-bar -->
  <nav style="
    position: fixed; top: 0; left: 0; right: 0; height: 58px;
    background: #0f172a; display: flex; align-items: center;
    padding: 0 28px; z-index: 100; gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  ">
    <img src="{% static 'assets/images/pti_logo.png' %}" alt="PTI Logo"
         style="width:32px;height:32px;object-fit:contain;border-radius:6px;"/>
    <span style="font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;">
      Clearance System
    </span>
    <ul style="
      list-style:none;display:flex;align-items:center;gap:6px;
      margin-left:auto;padding:0;
    ">
      <li>
        <a href="/user/login" style="
          display:inline-flex;align-items:center;padding:7px 16px;
          border-radius:6px;font-size:13.5px;font-weight:500;
          color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.20);
          text-decoration:none;transition:all .18s ease;
        ">Login</a>
      </li>
      <li>
        <a href="/user/register" style="
          display:inline-flex;align-items:center;padding:7px 16px;
          border-radius:6px;font-size:13.5px;font-weight:500;
          background:#3b82f6;color:#fff;text-decoration:none;
          transition:all .18s ease;
        ">Register</a>
      </li>
    </ul>
  </nav>

  <!-- Content (58px top offset for the nav) -->
  <div style="padding-top:58px;min-height:100vh;">

    {% block content %}
    {% endblock %}

  </div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      {% if messages %}
        {% for message in messages %}
          {% if message.tags == 'success' %}
            Swal.fire({
              icon: 'success',
              title: 'Success!',
              text: '{{ message }}',
              confirmButtonColor: '#3b82f6',
              confirmButtonText: 'OK'
            });
          {% elif message.tags == 'error' %}
            Swal.fire({
              icon: 'error',
              title: 'Oops…',
              text: '{{ message }}',
              confirmButtonColor: '#ef4444',
              confirmButtonText: 'OK'
            });
          {% endif %}
        {% endfor %}
      {% endif %}
    });
  </script>

  <!-- Password show/hide -->
  <script src="{% static 'assets/js/password.js' %}"></script>

  <!-- jQuery -->
  <script src="{% static 'assets/js/vendors/jquery/jquery.min.js' %}"></script>
  <!-- Bootstrap JS -->
  <script src="{% static 'assets/js/vendors/bootstrap/dist/js/bootstrap.bundle.min.js' %}" defer=""></script>
  <script src="{% static 'assets/js/vendors/bootstrap/dist/js/popper.min.js' %}" defer=""></script>

</body>
</html>
