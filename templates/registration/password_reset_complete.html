{% extends 'auth/base.html' %}
{% load static %}
{% block content %}

<div class="auth-page-wrapper" style="justify-content:center;">
  <div class="auth-form-panel" style="flex:unset;width:100%;max-width:480px;">
    <div class="auth-form-box">

      <div class="auth-form-card text-center">

        <div style="
          width:72px;height:72px;border-radius:50%;
          background:rgba(0,196,140,.12);border:2px solid #00c48c;
          display:flex;align-items:center;justify-content:center;
          margin:0 auto 24px;
        ">
          <i class="fas fa-check-circle" style="font-size:30px;color:#00c48c;"></i>
        </div>

        <h2 style="font-size:1.4rem;font-weight:800;color:#011b33;letter-spacing:-.025em;margin-bottom:10px;">
          Password reset complete
        </h2>
        <p style="font-size:14px;color:#6b7180;line-height:1.7;margin-bottom:28px;">
          Your password has been set successfully. You can now sign in
          with your new password.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary w-100">
          <i class="fas fa-sign-in-alt me-1"></i> Sign in to your account
        </a>

      </div>

    </div>
  </div>
</div>

{% endblock %}
